name: Build RootFS (Ubuntu)-V3

# 为小米平板6S Pro (sheng, SM8550) 构建 Ubuntu rootfs.img + boot.img
# V3修订：修复文件名括号特殊字符、增加7z自动分卷逻辑
on:
  workflow_dispatch:
    inputs:
      ubuntu_series:
        description: 'Ubuntu 发行版本'
        required: true
        type: choice
        default: '26.04 (resolute)'
        options:
          - '26.04 (resolute)'
          - '26.10'
          - '25.10'
      desktop:
        description: '桌面环境（server 无图形界面；Lomiri即Ubuntu Touch桌面）'
        required: true
        type: choice
        default: 'KDE Plasma'
        options:
          - 'KDE Plasma'
          - 'GNOME'
          - 'Lomiri'
          - 'server'
      plasma_mobile:
        description: '使用 plasma-mobile 移动端版本（仅KDE Plasma生效）'
        required: false
        type: boolean
        default: false
      browser:
        description: '浏览器'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'firefox'
      autologin:
        description: '开机自动登录（Lomiri默认开启自动登录）'
        required: false
        type: boolean
        default: true
      username:
        description: '系统用户名'
        required: false
        default: username
      hostname:
        description: '主机名'
        required: false
        default: xiaomi-sheng
      password:
        description: '用户密码（留空优先读取仓库secret ROOTFS_PASSWORD）'
        required: false
        default: ''
      language:
        description: '系统区域语言locale'
        required: true
        type: choice
        default: 'None (C.UTF-8)'
        options:
          - 'None (C.UTF-8)'
          - 'zh_CN.UTF-8'
          - 'en_US.UTF-8'
      boot_mode:
        description: '启动分区模式'
        required: true
        type: choice
        default: 'dual (linux)'
        options:
          - 'dual (linux)'
          - 'single (userdata)'
          - 'custom'
      custom_partition:
        description: '自定义分区名称（仅custom模式生效）'
        required: false
        default: ''
      quiet_boot:
        description: '安静开机（Plymouth开机动画，server模式无效）'
        required: false
        type: boolean
        default: true
      kernel_source:
        description: '内核来源（custom模式不支持预编译内核）'
        required: true
        type: choice
        default: 'prebuilt'
        options:
          - 'prebuilt'
          - 'custom_build'
      kernel_repo:
        description: '内核仓库地址（custom内核编译使用）'
        required: false
        default: 'https://github.com/ianchb/sm8550-mainline'
      kernel_branch:
        description: '内核分支'
        required: false
        default: 'sheng-7.2.6'
      kernel_config:
        description: '内核配置文件路径'
        required: false
        default: 'config/sm8550'
      kernel_release_ver:
        description: '预编译内核版本号'
        required: false
        default: '7.2.6'
      firmware_repo:
        description: '固件仓库地址'
        required: false
        default: 'https://github.com/ianchb/sheng-firmware'
      firmware_branch:
        description: '固件分支'
        required: false
        default: 'master'
      rootfs_size:
        description: 'rootfs镜像初始大小'
        required: false
        default: '10G'
      shrink_image:
        description: '构建完成自动收缩镜像（e2fsck+resize2fs）'
        required: false
        type: boolean
        default: true
      upload_artifacts:
        description: '上传临时产物到Actions Artifact（7天后自动删除，测试构建开启）'
        required: false
        type: boolean
        default: true
      publish_release:
        description: '发布产物到GitHub Release（正式发布开启，测试构建关闭）'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release标签名，例 v1.0.0，留空自动生成build-runid标签'
        required: false
        default: ''

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  packages:
    name: 构建设备包
    uses: ./.github/workflows/_packages.yml
    with:
      kernel_source: ${{ inputs.kernel_source }}
      kernel_repo: ${{ inputs.kernel_repo }}
      kernel_branch: ${{ inputs.kernel_branch }}
      kernel_config: ${{ inputs.kernel_config }}
      kernel_release_ver: ${{ inputs.kernel_release_ver }}
      firmware_repo: ${{ inputs.firmware_repo }}
      firmware_branch: ${{ inputs.firmware_branch }}

  build-rootfs:
    name: 汇编Ubuntu RootFS
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    needs: packages
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ======================
      # 【此处粘贴你原有rootfs构建脚本，生成rootfs.img boot.img】
      # ======================
      - name: 占位测试步骤（正式部署删除本行，替换为真实构建逻辑）
        run: echo "占位，替换为rootfs构建脚本"

      # 安装7z
      - name: Install 7-Zip
        run: |
          sudo apt update
          sudo apt install -y p7zip-full

      # 7z极限打包镜像：>=1.9GB自动分卷1900MB，否则单包，修复文件名特殊字符
      - name: 7z极限打包镜像（自动分包）
        run: |
          set -e
          SERIES_RAW="${{ inputs.ubuntu_series }}"
          SERIES_SAFE="${SERIES_RAW//\(/_}"
          SERIES_SAFE="${SERIES_SAFE//\)/_}"
          DESK_RAW="${{ inputs.desktop }}"
          DESK_SAFE="${DESK_RAW// /_}"

          PKG_NAME="ubuntu-sheng-${SERIES_SAFE}-${DESK_SAFE}"

          # 统计原始img总字节
          SIZE=$(stat -c %s rootfs.img boot.img | awk '{sum+=$1} END {print sum}')
          THRESHOLD=$((1900 * 1024 * 1024))
          echo "原始镜像总大小: $SIZE bytes"

          if [ $SIZE -ge $THRESHOLD ]; then
            echo "原始镜像总和 >=1.9GB，启用分卷1900MB"
            7z a -t7z -mx=9 -mfb=273 -md=1024m -v1900m "${PKG_NAME}.7z" rootfs.img boot.img
          else
            echo "原始镜像总和 <1.9GB，打包为单个7z"
            7z a -t7z -mx=9 -mfb=273 -md=1024m "${PKG_NAME}.7z" rootfs.img boot.img
          fi
        shell: bash

      # 上传临时Artifact
      - name: Upload Actions Artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-rootfs-sheng
          path: |
            *.7z*
            rootfs.img
            boot.img

      # 发布到GitHub Release
      - name: Publish to GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || format('build-{0}', github.run_id) }}
          name: "Ubuntu ${{ inputs.ubuntu_series }} ${{ inputs.desktop }} for xiaomi-sheng(SM8550)"
          body: |
            ## 小米平板6S Pro (sheng SM8550) Ubuntu 镜像构建
            - Ubuntu发行版本：${{ inputs.ubuntu_series }}
            - 构建日期：${{ github.run_created_at }}
            - 桌面环境：${{ inputs.desktop }}
            - 内核来源：${{ inputs.kernel_source }}
            - 语言：${{ inputs.language }}
            - 构建Workflow: Build RootFS (Ubuntu)-V3
            - 构建Workflow ID: ${{ github.run_id }}
            - 构建提交SHA: ${{ github.sha }}
            > ⚠️ 分卷下载说明：全部下载 .7z.001 .7z.002... 放到同一目录，打开001即可解压全部
          files: |
            *.7z*
            rootfs.img
            boot.img
          append_body: true
          draft: false
          prerelease: true
